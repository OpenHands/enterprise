x-app-image: &app-image ${APP_IMAGE:-ghcr.io/openhands/enterprise-server:1.81.0} # x-release-please-version

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-openhands}
      POSTGRES_PASSWORD: ${DB_PASS:-openhands}
      POSTGRES_DB: ${DB_NAME:-openhands}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-openhands}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # GitLab webhook dedup, MCP OAuth connections and conversation-export locking need Redis.
  # Its keys are short-lived, so it has no volume.
  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: *app-image
    # The entrypoint script in the image must run as root.
    user: '0:0'
    depends_on: &app-depends-on
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    # The Docker socket lets the app start sandbox containers.
    volumes: &app-volumes
      - /var/run/docker.sock:/var/run/docker.sock
      - app-filestore:/.openhands
    extra_hosts: &app-extra-hosts
      - 'host.docker.internal:host-gateway'
    environment: &app-environment
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-openhands}
      DB_USER: ${DB_USER:-openhands}
      DB_PASS: ${DB_PASS:-openhands}
      REDIS_HOST: redis
      OH_DEPLOYMENT_MODE: self_hosted
      OH_APP_MODE: saas
      PERMITTED_CORS_ORIGINS: http://localhost:${APP_PORT:-9043}
      # If you open the app on an address other than localhost, set WEB_HOST and WEB_URL to that address.
      WEB_HOST: ${WEB_HOST:-localhost}
      OH_WEB_URL: ${WEB_URL:-http://localhost:${APP_PORT:-9043}}
      # Sandboxes reach the app through the proxy.
      OH_SANDBOX_WEB_URL: http://proxy
      RUN_MIGRATIONS_ON_STARTUP: 'true'
      # The app uses its own password login, so Keycloak is not needed.
      ENABLE_INTEGRATED_IDP: 'true'
      OH_WEB_CLIENT_FEATURE_FLAGS_ENABLE_OAUTH_V2_LOGIN: '1'
      ENABLE_SUPER_ADMIN: '1'
      OH_WEB_CLIENT_FEATURE_FLAGS_ENABLE_SUPER_ADMIN: '1'
      # Each user adds their own LLM key in Settings, so no LiteLLM proxy is needed.
      ENABLE_LEGACY_LITELLM: 'false'
      OH_LLM_MODEL_KIND: server.verified_models.litellm_proxy_model_router.LiteLLMProxyModelServiceInjector
      OH_ALLOW_USER_LLM_CONFIGURATION: 'true'
      ENABLE_BILLING: 'false'
      # Rate limiting adds nothing for a single evaluator.
      RATE_LIMITING_ENABLED: 'false'
      POSTHOG_CLIENT_KEY: ${POSTHOG_CLIENT_KEY:-}
      SANDBOX_HOST_PORT: ${APP_PORT:-9043}
      SANDBOX_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_default
      SANDBOX_CONTAINER_URL_PATTERN: ${WEB_URL:-http://localhost:${APP_PORT:-9043}}/runtime/{sandbox_id}/{port}
      # New conversations reuse the running sandbox with the fewest conversations, so fewer sandbox containers run.
      OH_APP_CONVERSATION_SANDBOX_GROUPING_STRATEGY: FEWEST_CONVERSATIONS
      OH_AGENT_SERVER_ENV: '{"AGENT_SERVER_PORT": "8000"}'
      AUTOMATION_SERVICE_URL: http://automation-server:8000/api/automation
      # This value must match AUTOMATION_SERVICE_KEY on automation-server.
      AUTOMATIONS_SERVICE_KEY: ${AUTOMATION_SERVICE_KEY:-local-compose-service-key}
      AUTOMATION_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:-local-compose-webhook-secret}
      AUTOMATION_EVENT_FORWARDING_ENABLED: 'true'
    # The first start pulls the agent server image, which can take many minutes.
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:3000/alive')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 1h
    restart: unless-stopped

  automation-server:
    image: ${AUTOMATION_IMAGE:-ghcr.io/openhands/automation:1.25.1}
    command:
      ['uvicorn', 'openhands.automation.app:app', '--host', '0.0.0.0', '--port', '8000']
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8000'
    volumes:
      - automation-data:/data
    # Sandbox URLs use localhost:9043, so localhost must point to the Docker host, where the proxy listens.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'localhost:host-gateway'
    environment:
      # The service creates and migrates its own database on startup.
      AUTOMATION_RUN_MIGRATIONS_ON_STARTUP: 'true'
      AUTOMATION_CREATE_DATABASE_IF_MISSING: 'true'
      AUTOMATION_DB_HOST: db
      AUTOMATION_DB_PORT: '5432'
      AUTOMATION_DB_NAME: ${AUTOMATION_DB_NAME:-automations}
      AUTOMATION_DB_USER: ${DB_USER:-openhands}
      AUTOMATION_DB_PASS: ${DB_PASS:-openhands}
      AUTOMATION_DB_SSL_MODE: disable
      FILE_STORE: local
      LOCAL_STORAGE_PATH: /data
      AUTOMATION_OPENHANDS_API_BASE_URL: http://app:3000
      AUTOMATION_SERVICE_KEY: ${AUTOMATION_SERVICE_KEY:-local-compose-service-key}
      AUTOMATION_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:-local-compose-webhook-secret}
      AUTOMATION_KV_SECRET: ${AUTOMATION_KV_SECRET:-local-compose-kv-secret}
      # Sandboxes call the automation service at this URL.
      AUTOMATION_BASE_URL: http://proxy
      AUTOMATION_CORS_ORIGINS: http://localhost:${APP_PORT:-9043}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  canvas-server:
    image: ${AGENT_CANVAS_IMAGE:-ghcr.io/openhands/agent-canvas:1.32.0}
    init: true
    # The image includes other servers, but this stack only needs its static file server.
    entrypoint: ['node', '/opt/agent-canvas/static-server.mjs']
    # AGENT_CANVAS_LOCK_TO_CLOUD must exactly match the address in your browser, such as http://localhost:9043.
    command:
      - --port
      - '8000'
      - --host
      - 0.0.0.0
      - --dir
      - /opt/agent-canvas/frontend
      - --base-path
      - /canvas
      - --lock-to-cloud
      - ${AGENT_CANVAS_LOCK_TO_CLOUD:-http://localhost:${APP_PORT:-9043}}
      - --disable-telemetry
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8000/canvas/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Caddy is used as a reverse proxy, and all traffic is served via localhost:9043.
  proxy:
    image: caddy:2
    depends_on:
      app:
        condition: service_healthy
      automation-server:
        condition: service_healthy
      canvas-server:
        condition: service_healthy
    ports:
      - '${APP_PORT:-9043}:80'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    restart: unless-stopped

  # The worker runs background jobs, such as sandbox cleanup.
  worker:
    image: *app-image
    user: '0:0'
    command: ['python', '-m', 'openhands.app_server.worker']
    depends_on: *app-depends-on
    volumes: *app-volumes
    extra_hosts: *app-extra-hosts
    environment:
      <<: *app-environment
      OH_WORKER_SCHEDULED_JOBS_APP_CONVERSATION_START_TASK_CLEAN: 'true'
    restart: unless-stopped

volumes:
  db-data:
  app-filestore:
  automation-data:

configs:
  caddyfile:
    content: |
      {
        auto_https off
        admin off
      }
      :80 {
        # Only automation-server uses this API, so the proxy blocks it.
        @internal path /api/service /api/service/*
        handle @internal {
          respond 404
        }

        # Requests to /runtime/<sandbox>/<port>/ go to that port on the sandbox container.
        @runtime path_regexp runtime ^/runtime/(oh-agent-server-[A-Za-z0-9]+)/(\d+)(/.*)?$$
        handle @runtime {
          uri strip_prefix /runtime/{re.runtime.1}/{re.runtime.2}
          reverse_proxy {re.runtime.1}:{re.runtime.2}
        }

        @automation path /api/automation /api/automation/*
        handle @automation {
          reverse_proxy automation-server:8000
        }

        @canvas path /canvas /canvas/*
        handle @canvas {
          reverse_proxy canvas-server:8000
        }

        handle {
          reverse_proxy app:3000
        }
      }
