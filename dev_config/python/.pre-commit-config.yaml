repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/|modules/|python/|openhands-ui/)
      - id: end-of-file-fixer
        exclude: ^(docs/|modules/|python/|openhands-ui/)
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: debug-statements


  - repo: local
    hooks:
      - id: warn-appmode-oss
        name: "Warn on AppMode.OSS in backend (use AppMode.OPENHANDS)"
        language: system
        entry: bash -lc 'if rg -n "\\bAppMode\\.OSS\\b" openhands server storage integrations sync analytics utils tests/unit; then echo "Found AppMode.OSS usage. Prefer AppMode.OPENHANDS."; exit 1; fi'
        pass_filenames: false

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.5.1
    hooks:
      - id: pyproject-fmt
        args: [--keep-full-version]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.5
    hooks:
      # Run the linter. Config is auto-discovered from pyproject.toml.
      - id: ruff
        types_or: [python, pyi, jupyter]
        args: [--fix, --unsafe-fixes]
      # Run the formatter. Config is auto-discovered from pyproject.toml.
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          [
            types-requests,
            types-setuptools,
            types-pyyaml,
            types-toml,
            types-docker,
            types-Markdown,
            types-redis,
            pydantic,
            lxml,
            "openhands-sdk==1.39.1",
            "openhands-tools==1.39.1",
            "sqlalchemy>=2.0",
            "stripe==11.6.0",
            "pygithub==2.6.1",
          ]
        # The app server and the SaaS modules that sit beside it at the repo root.
        # To see gaps add `--html-report mypy-report/`
        entry: mypy --config-file dev_config/python/mypy.ini openhands/ server/ storage/ integrations/ sync/ analytics/ utils/
        always_run: true
        pass_filenames: false
