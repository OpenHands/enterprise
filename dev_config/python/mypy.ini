[mypy]
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = True
explicit_package_bases = True
warn_unreachable = True
warn_redundant_casts = True
no_implicit_optional = True
strict_optional = True
disable_error_code = type-abstract

# Alembic migration scripts are not type checked
exclude = (^migrations/)

# Flag un-awaited coroutines in the SaaS modules.
[mypy-server.*,storage.*,integrations.*,sync.*,analytics.*,utils.*]
enable_error_code = unused-awaitable

# Generated by scripts/substrate/generate_ateapi.py.
[mypy-openhands.app_server.sandbox.substrate.ateapi_pb2,openhands.app_server.sandbox.substrate.ateapi_pb2_grpc]
ignore_errors = True

[mypy-openai.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-litellm.*]
follow_imports = skip
ignore_missing_imports = True
