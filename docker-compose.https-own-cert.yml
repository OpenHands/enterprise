# This file serves OpenHands over HTTPS at WEB_HOST with your own certificate.
# Caddy reads the certificate from certs/cert.pem and the private key from certs/key.pem.
services:
  # All traffic comes through the https service, so the proxy service is not published on the host.
  proxy:
    ports: !reset []

  https:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./certs:/certs:ro
    configs:
      - source: https-caddyfile
        target: /etc/caddy/Caddyfile
    # Containers in the stack reach WEB_HOST through this service, not through the public IP address.
    networks:
      default:
        aliases:
          - ${WEB_HOST:?Set WEB_HOST to your domain name}
    restart: unless-stopped

configs:
  https-caddyfile:
    content: |
      ${WEB_HOST} {
        tls /certs/cert.pem /certs/key.pem
        reverse_proxy proxy:80
      }
