[pytest]
# ddtrace is a runtime dependency of the enterprise server, so its pytest plugins
# would otherwise auto-load into every test run.
addopts = -p no:warnings -p no:ddtrace -p no:ddtrace.pytest_bdd -p no:ddtrace.pytest_benchmark
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# enterprise/ code imports its own packages unprefixed ("from storage.base import Base"),
# matching the container layout where enterprise/ is flattened onto PYTHONPATH.
pythonpath = . enterprise
