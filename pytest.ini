[pytest]
pythonpath = . quint-specs/oracle-client/python
# ddtrace ships pytest plugins that auto-register via entry points; keep them out of the test run.
# quint_oracle.pytest_plugin registers each test with the Quint oracle; it is inert unless
# QUINT_ORACLE_URL is set, which only `quint oracle` does.
addopts = -p no:warnings -p no:ddtrace -p no:ddtrace.pytest_bdd -p no:ddtrace.pytest_benchmark -p quint_oracle.pytest_plugin
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
