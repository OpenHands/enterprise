sonar.projectKey=enterprise
sonar.projectName=enterprise

# Two Python roots: dropping `openhands` silently loses part of the app. The two
# frontend trees are separate packages with separate lockfiles.
sonar.sources=enterprise,openhands,frontend/src,openhands-ui
sonar.tests=tests,enterprise/tests,frontend/__tests__,frontend/tests

# enterprise/tests sits inside the enterprise source root, and SonarQube requires
# sources and tests to be disjoint -- without this it aborts on "can't be indexed
# twice". The other test paths are siblings of their source roots, not children.
sonar.exclusions=enterprise/tests/**,**/migrations/**,**/node_modules/**,**/dist/**,**/.storybook/**,containers/**,kind/**,dev_config/**,**/*.tmpl

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
