# Procrastinate: the worker runs inside each FastAPI replica; Postgres is the broker.
x-app: &app
  build: candidate
  image: tq-poc-procrastinate
  command: uvicorn app:api --host 0.0.0.0 --port 8000
  depends_on:
    migrate:
      condition: service_completed_successfully
  environment: &app-env
    POC_DATABASE_URL: postgresql://poc_app:poc_app@postgres/poc
    POC_INTERVAL_SECONDS: ${POC_INTERVAL_SECONDS:-10}
    POC_JOB_SECONDS: ${POC_JOB_SECONDS:-1}
    POC_STALLED_RETRY: ${POC_STALLED_RETRY:-1}
    POC_JOB_BLOCKING: ${POC_JOB_BLOCKING:-0}
    POC_SYNC_TASK: ${POC_SYNC_TASK:-0}

services:
  migrate:
    build: candidate
    image: tq-poc-procrastinate
    command: alembic -c /harness/alembic.ini upgrade head
    environment:
      POC_MIGRATE_URL: postgresql://poc:poc@postgres/poc
    depends_on:
      postgres:
        condition: service_healthy
  replica-a:
    <<: *app
    hostname: replica-a
  replica-b:
    <<: *app
    hostname: replica-b
    environment:
      <<: *app-env
      LD_PRELOAD: ${POC_FAKETIME_PRELOAD:-}
      FAKETIME: ${POC_SKEW:-+0s}
      FAKETIME_DONT_FAKE_MONOTONIC: "1"
