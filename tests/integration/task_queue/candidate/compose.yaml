# DBOS: each replica runs a DBOS executor against the shared system database.
x-app: &app
  build: candidate
  image: tq-poc-dbos
  command: uvicorn app:app --host 0.0.0.0 --port 8000
  depends_on:
    migrate:
      condition: service_completed_successfully
  environment: &app-env
    POC_DATABASE_URL: postgresql://poc_app:poc_app@postgres/poc
    POC_INTERVAL_SECONDS: ${POC_INTERVAL_SECONDS:-10}
    POC_JOB_SECONDS: ${POC_JOB_SECONDS:-1}
    POC_DBOS_EXECUTOR: ${POC_DBOS_EXECUTOR:-default}
    POC_DBOS_PEER_RECOVERY: ${POC_DBOS_PEER_RECOVERY:-0}

services:
  # Harness race: pg_isready over the Unix socket passes against the entrypoint's
  # temporary init server, so under load migrate connected before TCP was up.
  # Over TCP it passes only once the real server listens.
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U poc -d poc"]
  migrate:
    build: candidate
    image: tq-poc-dbos
    command: alembic -c /harness/alembic.ini upgrade head
    environment:
      POC_MIGRATE_URL: postgresql://poc:poc@postgres/poc
    depends_on:
      postgres:
        condition: service_healthy
  replica-a:
    <<: *app
    hostname: replica-a
  replica-b:
    <<: *app
    hostname: replica-b
    environment:
      <<: *app-env
      LD_PRELOAD: ${POC_FAKETIME_PRELOAD:-}
      FAKETIME: ${POC_SKEW:-+0s}
      FAKETIME_DONT_FAKE_MONOTONIC: "1"
