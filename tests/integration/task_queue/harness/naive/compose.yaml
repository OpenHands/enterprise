# Harness self-test: an in-process loop with no coordination. Every replica
# fires every occurrence, so P1 must fail unless POC_GUARD=1.
x-app: &app
  build: harness/naive
  image: tq-poc-naive
  command: uvicorn app:app --host 0.0.0.0 --port 8000
  depends_on:
    migrate:
      condition: service_completed_successfully
  environment: &app-env
    POC_DATABASE_URL: postgresql://poc_app:poc_app@postgres/poc
    POC_INTERVAL_SECONDS: ${POC_INTERVAL_SECONDS:-10}
    POC_JOB_SECONDS: ${POC_JOB_SECONDS:-1}
    POC_GUARD: ${POC_GUARD:-0}

services:
  migrate:
    build: harness/naive
    image: tq-poc-naive
    command: alembic -c /harness/alembic.ini upgrade head
    environment:
      POC_MIGRATE_URL: postgresql://poc:poc@postgres/poc
    depends_on:
      postgres:
        condition: service_healthy
  replica-a:
    <<: *app
    hostname: replica-a
  replica-b:
    <<: *app
    hostname: replica-b
    environment:
      <<: *app-env
      LD_PRELOAD: ${POC_FAKETIME_PRELOAD:-}
      FAKETIME: ${POC_SKEW:-+0s}
      FAKETIME_DONT_FAKE_MONOTONIC: "0"
