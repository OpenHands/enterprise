# DBOS with the open-source dbos-relay control plane (Conductor protocol).
# Relay detects a silent executor and dispatches its workflows to a live one,
# so replicas need no stable identity. Relay runs as one long-lived container
# outside the project (see RESULTS.md): start it, mint a key with
# `relay apikey create`, and export it as POC_RELAY_KEY.
x-app: &app
  build: candidate
  image: tq-poc-dbos
  command: uvicorn app:app --host 0.0.0.0 --port 8000
  depends_on:
    migrate:
      condition: service_completed_successfully
  environment: &app-env
    POC_DATABASE_URL: postgresql://poc_app:poc_app@postgres/poc
    POC_INTERVAL_SECONDS: ${POC_INTERVAL_SECONDS:-10}
    POC_JOB_SECONDS: ${POC_JOB_SECONDS:-1}
    POC_DBOS_SHUTDOWN_SECONDS: ${POC_DBOS_SHUTDOWN_SECONDS:-50}
    POC_DBOS_CONDUCTOR_URL: ${POC_RELAY_URL:-ws://host.docker.internal:18090}
    POC_DBOS_CONDUCTOR_KEY: ${POC_RELAY_KEY:?set POC_RELAY_KEY}

services:
  migrate:
    build: candidate
    image: tq-poc-dbos
    command: alembic -c /harness/alembic.ini upgrade head
    environment:
      POC_MIGRATE_URL: postgresql://poc:poc@postgres/poc
    depends_on:
      postgres:
        condition: service_healthy
  replica-a:
    <<: *app
    hostname: replica-a
  replica-b:
    <<: *app
    hostname: replica-b
