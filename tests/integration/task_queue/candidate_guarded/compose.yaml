# Setup 3b: APScheduler in both replicas' lifespan; the run-once guard picks one
# sender per occurrence. Same image and code as candidate/ (setup 3a).
x-env: &env
  POC_DATABASE_URL: postgresql://poc_app:poc_app@postgres/poc
  POC_REDIS_URL: redis://redis:6379/0
  POC_INTERVAL_SECONDS: ${POC_INTERVAL_SECONDS:-10}
  POC_JOB_SECONDS: ${POC_JOB_SECONDS:-1}

x-base: &base
  build: candidate
  image: tq-poc-dramatiq
  environment: *env
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

x-app: &app
  <<: *base
  command: uvicorn app:app --host 0.0.0.0 --port 8000

x-worker: &worker
  <<: *base
  command: dramatiq tasks --processes 1 --threads 8

services:
  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 # 7.4-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30
  migrate:
    build: candidate
    image: tq-poc-dramatiq
    command: alembic -c /harness/alembic.ini upgrade head
    environment:
      POC_MIGRATE_URL: postgresql://poc:poc@postgres/poc
    depends_on:
      postgres:
        condition: service_healthy
  replica-a:
    <<: *app
    hostname: replica-a
    environment:
      <<: *env
      POC_SCHEDULE: "1"
  replica-b:
    <<: *app
    hostname: replica-b
    environment:
      <<: *env
      POC_SCHEDULE: "1"
      LD_PRELOAD: ${POC_FAKETIME_PRELOAD:-}
      FAKETIME: ${POC_SKEW:-+0s}
      FAKETIME_DONT_FAKE_MONOTONIC: "0"
  worker-a:
    <<: *worker
    hostname: worker-a
  worker-b:
    <<: *worker
    hostname: worker-b
