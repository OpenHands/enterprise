global
  tune.bufsize 65536
  log stdout format raw local0
defaults
  mode http
  log global
  timeout connect 2s
  timeout client 10s
  timeout server 5s
  timeout tunnel 1m
  timeout queue 2s
  retries 0
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
frontend public
  http-response set-header X-Proxy-Generation initial
  bind :8443 ssl crt /certs/bundle.pem
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-For %[src]
  acl automation_path path /api/automation
  acl automation_path path_beg /api/automation/
  use_backend automation_backend if automation_path
  default_backend enterprise_backend
backend automation_backend
  server automation automation:8000 resolvers docker init-addr none
backend enterprise_backend
  server enterprise enterprise:8000 resolvers docker init-addr none
