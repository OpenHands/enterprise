[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "openhands-ai"
version = "1.58.0"
description = "OpenHands Enterprise: the OpenHands app server plus the SaaS/enterprise server that runs on top of it"
readme = "README.md"
license = "LicenseRef-Polyform-Free-Trial"
license-files = [ "LICENSE" ]
authors = [ { name = "OpenHands", email = "contact@all-hands.dev" } ]
requires-python = ">=3.12,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "aiohttp==3.14.1",                                # CVE-2026-54278 (fixed in 3.14.1); keep aiohttp on a fixed-or-newer release
  "alembic==1.18.4",
  "anthropic[vertex]",
  "anyio==4.9.0",
  "asyncpg==0.30.0",
  "authlib==1.6.12",                                # CVE-2026-44681 (fixed in 1.6.12 and 1.7.1; 1.7.0 is vulnerable)
  "bashlex==0.18",
  "binaryornot==0.6.0",
  "boto3",
  "browsergym-core==0.13.3",                        # integrate browsergym-core as the browsing interface
  "cloud-sql-python-connector==1.20.1",
  "coredis==4.24.0",
  "ddtrace==3.13.0",                                # pin to avoid yanked version 3.12.4
  "deprecated==1.3.1",
  "deprecation==2.1.0",
  "dirhash==0.5.0",
  "docker==7.1.0",
  "fastapi",
  "fastmcp>=3.2,<4",
  "gitpython==3.1.50",
  "google-api-python-client>=2.164",                # For Google Sheets API
  "google-auth-httplib2==0.3.1",                    # For Google Sheets authentication
  "google-auth-oauthlib==1.3.1",                    # For Google Sheets OAuth
  "google-cloud-aiplatform",
  "google-cloud-recaptcha-enterprise==1.31.0",
  "google-genai",                                   # To use litellm with Gemini Pro API
  "gspread==6.2.1",
  "html2text==2025.4.15",
  "httpx==0.28.1",
  "httpx-aiohttp==0.1.12",
  "ipywidgets==8.1.8",
  "jinja2==3.1.6",
  "joblib==1.5.3",
  "joserfc>=1.0.0",
  "json-repair",
  "jupyter-kernel-gateway==3.0.1",
  "kubernetes>=33.1",
  "libtmux>=0.46.2",
  "limits==5.8.0",
  "litellm==1.94.0",                                # Exact pin; litellm 1.94.0 is required by openhands-sdk 1.38.0+ (>=1.93.0). Bump explicitly when upgrading to ensure only the tested version is used.
  "lmnr>=0.7.20",
  "mcp==1.27.0",
  "memory-profiler==0.61.0",
  "numpy==2.4.4",
  "openai==2.33.0",                                 # Pin because litellm 1.84.1 requires 2.33.0 and is incompatible with >=1.100.0 (BerriAI/litellm#13711). litellm 1.94.0 allows >=2.20.0, so this pin could be relaxed but is kept for stability.
  "openhands-agent-server==1.44.1",
  "openhands-sdk==1.44.1",
  "openhands-tools==1.44.1",
  "opentelemetry-api==1.39.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
  "orjson==3.11.8",                                 # Pinned to fix CVE-2025-67221
  "pandas==2.3.3",
  "pathspec>=0.12.1",
  "pexpect==4.9.0",
  "pg8000==1.31.5",
  "pillow==12.3.0",
  "playwright==1.58.0",
  "posthog==7.9.12",
  "prometheus-client==0.24.1",
  "prompt-toolkit==3.0.52",
  "protobuf==5.29.6",                               # Updated to fix CVE-2026-0994
  "psutil==7.2.2",
  "psycopg2-binary==2.9.11",
  "pybase62==1.0.0",
  "pygithub>=2.5",
  "pyjwt==2.13.0",
  "pylatexenc==2.10",
  "pypdf==6.14.2",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "python-frontmatter==1.1.0",
  "python-json-logger==3.3.0",
  "python-keycloak==5.12.0",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "python-socketio==5.14.0",
  "pythonnet==3.0.5; sys_platform=='win32'",
  "pyyaml==6.0.3",
  "qtconsole==5.7.2",
  "rapidfuzz>=3.9",
  "redis==6.4.0",
  "requests==2.33.1",
  "resend==2.27.0",
  "scikit-learn==1.8.0",
  "setuptools==82.0.1",
  "shap==0.48.0",
  "shellingham==1.5.4",
  "slack-sdk==3.41.0",
  "sqlalchemy[asyncio]==2.0.48",
  "sse-starlette==3.3.4",
  "starlette==1.3.1",
  "stripe==11.6.0",
  "tenacity==9.1.4",
  "termcolor==3.3.0",
  "toml==0.10.2",
  "tornado==6.5.7",
  "tree-sitter-language-pack>=0.7.3",
  "types-toml",
  "urllib3==2.7.0",
  "uvicorn",
  "whatthepatch==1.0.7",
  "zope-interface==7.2",
]

urls.Homepage = "https://github.com/OpenHands/enterprise"
urls.Repository = "https://github.com/OpenHands/enterprise"

[dependency-groups]
dev = [
  "build",
  "mypy==1.17",
  "pre-commit==4.2",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.12.5",
  "types-requests",
  "types-setuptools",
]
test = [
  "freezegun==1.5.5",
  "gevent==25.9.1",
  "moto[s3]>=5.2.2,<6.0.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "pytest-forked==1.6.0",
  "pytest-playwright==0.7.2",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "reportlab==4.4.10",
]
runtime = [
  "flake8==7.3.0",
  "jupyterlab",
  "notebook==7.5.6",
]

# The repo root is the deployable layout: `openhands/` is the app server and the
# SaaS/enterprise modules (`server/`, `storage/`, ...) sit beside it, exactly as
# they are laid out in /app inside the Docker image. The wheel only exists so
# `uv sync` can install the project editable; the image copies the tree directly.

[tool.hatch.build.targets.wheel]
only-include = [
  "openhands",
  "server",
  "storage",
  "integrations",
  "sync",
  "analytics",
  "utils",
  "saas_server.py",
  "run_maintenance_tasks.py",
  "run_budget_maintenance.py",
]

[tool.ruff]
format.quote-style = "single"
lint.select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "Q",
  "UP006",
  "UP007",
  "UP008",
  "W",
]
lint.ignore = [
  "ASYNC109",
  "ASYNC110",
  "ASYNC220",
  "ASYNC221",
  "ASYNC230",
  "ASYNC251",
  "B003",
  "B007",
  "B009",
  "B010",
  "B018",
  "B904",
  "E501",
]
lint.flake8-bugbear.extend-immutable-calls = [
  "Body",
  "Depends",
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.params.Depends",
  "openhands.app_server.services.db_session.depends_db_session",
  "server.auth.user.user_authorizer.depends_user_authorizer",
]
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "single"

[tool.coverage.run]
concurrency = [ "gevent" ]
relative_files = true
source = [
  "openhands",
  "server",
  "storage",
  "integrations",
  "sync",
  "analytics",
  "utils",
  "migrations",
]
omit = [ "tests/*", "**/test_*" ]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { openhands-agent-server = false, openhands-sdk = false, openhands-tools = false, litellm = false }
