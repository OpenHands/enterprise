[project]
name = "openhands-ai"
version = "1.80.0"
description = "OpenHands Enterprise: the OpenHands app server plus the SaaS/enterprise server that runs on top of it"
requires-python = ">=3.12,<3.14"

classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aiohttp==3.14.5",                                # CVE-2026-54278 (fixed in 3.14.1); keep aiohttp on a fixed-or-newer release
  "alembic==1.20.0",
  "anthropic[vertex]",
  "anyio==4.15.1",
  "argon2-cffi==25.1.0",                            # Password hashing for the dev IDP (self-hosted email+password login)
  "asyncpg==0.32.0",
  "authlib==1.9.1",                                # CVE-2026-44681 (fixed in 1.6.12 and 1.7.1; 1.7.0 is vulnerable)
  "bashlex==0.18",
  "binaryornot==0.6.0",
  "boto3",
  "browsergym-core==0.13.3",                        # integrate browsergym-core as the browsing interface
  "certifi>=2026.10.19",                            # eMudhra CA distrust: GHSA-6q48-6c7w-9gw2 (floor, matching other remediation PRs)
  "cloud-sql-python-connector==1.20.1",
  "coredis==4.24.0",
  "cryptography==50.0.2",                           # SAML SP key pair generation (storage.auth_provider_details)
  "ddtrace==4.16.0",                                 # pin to avoid yanked version 3.12.4
  "defusedxml==0.7.1",                              # Safe SAML IdP metadata XML parsing (server.services.saml_metadata)
  "deprecated==1.3.1",
  "deprecation==2.1.0",
  "dirhash==0.5.0",
  "docker==7.2.0",
  "e2b==2.57.0",
  "fastapi",
  "fastmcp>=3.2,<4",
  "gitpython==3.2.1",
  "google-api-python-client>=2.201.0",                # For Google Sheets API
  "google-auth-httplib2==0.4.4",                    # For Google Sheets authentication
  "google-auth-oauthlib==1.5.0",                    # For Google Sheets OAuth
  "google-cloud-aiplatform",
  "google-cloud-recaptcha-enterprise==1.31.0",
  "google-genai",                                   # To use litellm with Gemini Pro API
  "gspread==6.2.1",
  "html2text==2025.4.15",
  "httpx==0.28.1",
  "httpx-aiohttp==0.2.0",
  "ipywidgets==8.1.9",
  "jinja2==3.1.6",
  "joblib==1.6.0",
  "joserfc>=1.7.7",
  "json-repair",
  "jupyter-kernel-gateway==3.0.1",
  "k8s-agent-sandbox[async]==1.0.7",
  "kubernetes>=33.1",
  "libtmux>=0.62.0",
  "limits==5.8.0",
  "litellm==1.94.0",                                # Exact pin; litellm 1.94.0 is required by openhands-sdk 1.38.0+ (>=1.93.0). Bump explicitly when upgrading to ensure only the tested version is used.
  "lmnr>=0.7.20",
  "mcp==1.28.1",
  "memory-profiler==0.61.0",
  "numpy==2.5.4",
  "openai==2.33.0",                                 # Pin because litellm 1.84.1 requires 2.33.0 and is incompatible with >=1.100.0 (BerriAI/litellm#13711). litellm 1.94.0 allows >=2.20.0, so this pin could be relaxed but is kept for stability.
  "openhands-agent-server==1.58.1",
  "openhands-sdk==1.58.1",
  "openhands-tools==1.58.1",
  "opentelemetry-api==1.39.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
  "orjson==3.13.0",                                 # Pinned to fix CVE-2025-67221
  "pandas==2.3.3",
  "pathspec>=1.1.1",
  "pexpect==4.9.0",
  "pg8000==1.31.5",
  "pillow==12.3.0",
  "playwright==1.64.0",
  "posthog==7.73.1",
  "procrastinate==3.10.0",
  "prometheus-client==0.26.0",
  "prompt-toolkit==3.0.53",
  "protobuf==5.29.6",                               # Updated to fix CVE-2026-0994
  "psutil==7.2.2",
  "psycopg[binary,pool]==3.3.6",
  "psycopg2-binary==2.9.13",
  "pybase62==1.0.0",
  "pygithub>=2.10.0",
  "pyjwt==2.15.1",
  "pylatexenc==2.11",
  "pypdf==6.21.1",
  "python-docx==1.2.0",
  "python-dotenv==1.2.4",
  "python-frontmatter==1.3.0",
  "python-json-logger==3.3.0",
  "python-keycloak==5.12.0",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "python-socketio==5.17.0",
  "python3-saml==1.16.0",                           # SAML SP login (server.routes.saml): AuthnRequest/Response handling
  "pythonnet==3.2.1; sys_platform=='win32'",
  "pyyaml==6.0.3",
  "qtconsole==5.7.2",
  "rapidfuzz>=3.14.6",
  "redis==6.4.0",
  "requests==2.34.2",
  "resend==2.50.0",
  "scikit-learn==1.9.1",
  "setuptools==83.0.0",
  "shap==0.54.1",
  "shellingham==1.5.4",
  "slack-sdk==3.45.0",
  "sqlalchemy[asyncio]==2.1.5",
  "sse-starlette==3.5.0",
  "starlette==1.9.0",
  "stripe==11.6.0",
  "tenacity==9.1.4",
  "termcolor==3.3.0",
  "toml==0.10.2",
  "tornado==6.5.10",
  "tree-sitter-language-pack>=0.7.3",
  "types-toml",
  "urllib3==2.8.0",
  "uvicorn",
  "whatthepatch==1.0.7",
  "xmlsec==1.3.17",                                 # Native XML-DSig signing/verification backing python3-saml
  "zope-interface==7.2",
]

[dependency-groups]
dev = [
  "build",
  "mypy==1.17",
  "pre-commit==4.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
  "types-defusedxml",
  "types-requests",
  "types-setuptools",
]
test = [
  "freezegun==1.5.5",
  "gevent==25.9.1",
  "hypothesis==6.170.5",
  "moto[s3]>=5.2.2,<6.0.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-forked==1.7.5",
  "pytest-playwright==0.10.0",
  "pytest-split==0.11.0",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "reportlab==4.4.10",
  "testcontainers==4.15.0",
]
runtime = [
  "flake8==7.4.1",
  "jupyterlab",
  "notebook==7.6.3",
]

[tool.ruff]
format.quote-style = "single"
lint.select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "Q",
  "UP006",
  "UP007",
  "UP008",
  "W",
]
lint.ignore = [
  "ASYNC109",
  "ASYNC110",
  "ASYNC220",
  "ASYNC221",
  "ASYNC230",
  "ASYNC251",
  "B003",
  "B007",
  "B009",
  "B010",
  "B018",
  "B904",
  "E501",
]
lint.flake8-bugbear.extend-immutable-calls = [
  "Body",
  "Depends",
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.Form",
  "fastapi.params.Depends",
  "Form",
  "openhands.app_server.services.db_session.depends_db_session",
  "server.auth.user.user_authorizer.depends_user_authorizer",
]
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "single"

[tool.coverage.run]
concurrency = [ "gevent" ]
relative_files = true
source = [
  "openhands",
  "server",
  "storage",
  "integrations",
  "sync",
  "analytics",
  "utils",
  "migrations",
]
omit = [ "tests/*", "**/test_*" ]

[tool.uv]
package = false
exclude-newer = "7 days"
exclude-newer-package = { certifi = false, openhands-agent-server = false, openhands-sdk = false, openhands-tools = false, litellm = false, procrastinate = "2026-09-24T00:00:00Z" } # certifi: eMudhra CA distrust fix must not wait out the cooldown (GHSA-6q48-6c7w-9gw2)
