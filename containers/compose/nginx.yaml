services:
  proxy:
    image: nginx@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
    restart: unless-stopped
    cpus: 1
    mem_limit: 256m
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx:/etc/nginx:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR}:/certs:ro
    networks:
      default:
        ipv4_address: ${PROXY_IPV4_ADDRESS:-172.30.44.10}
