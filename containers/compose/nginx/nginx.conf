events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  large_client_header_buffers 4 32k;
  resolver 127.0.0.11 valid=1s ipv6=off;
  upstream automation_backend {
    zone automation_backend 64k;
    server automation:8000 resolve max_conns=16;
  }
  upstream enterprise_backend {
    zone enterprise_backend 64k;
    server enterprise:3000 resolve;
  }
  server {
    listen 8443 ssl;
    client_max_body_size 100m;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream off;
    location = /api/automation { proxy_pass http://automation_backend; }
    location /api/automation/ { proxy_pass http://automation_backend; }
    location / {
      proxy_read_timeout 1h;
      proxy_pass http://enterprise_backend;
    }
  }
}
