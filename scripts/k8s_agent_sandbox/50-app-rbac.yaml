# What the app needs: claim and release sandboxes, and suspend or resume the
# sandbox a claim holds. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openhands-app
  namespace: openhands-sandboxes
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "patch"]
---
# Replace the subject with the ServiceAccount the app's pods run as. An app
# outside the cluster needs a kubeconfig for a ServiceAccount bound here.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openhands-app
  namespace: openhands-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openhands-app
subjects:
  - kind: ServiceAccount
    name: openhands
    namespace: openhands
