name = "API Key Lifecycle"
description = "Long-lived bearer credentials with a not_before/expires_at activation window, debounced compare-and-set last_used_at touch, org binding, and protected system keys."
role = "central"
rank = 0
paths = [
    "enterprise/storage/api_key.py",
    "enterprise/storage/api_key_store.py",
