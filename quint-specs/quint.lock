[components.api-key-management]
name = "API Key Management"
description = "Mint, list, validate, rotate and delete user and system API keys, including the BYOR key flow and the internal service-to-service key endpoint."
role = "central"
rank = 18
paths = [
    "server/routes/api_keys.py",
    "server/routes/service.py",
    "storage/api_key.py",
    "storage/api_key_store.py",
]
tests = [
    "tests/unit/test_api_key_store.py",
    "tests/unit/routes/test_service.py",
    "tests/unit/app_server/test_managed_key_rotation.py",
]
dependencies = [
    "rbac-authorization",
    "litellm-proxy-integration",
    "saas-identity-and-session",
    "org-api-surface",
    "user-account-lifecycle",
]
operations = [
    "`generate_byor_key(...)` — mutates",
    "`delete_byor_key_from_litellm(...)` — mutates",
    "`get_byor_key_from_db(...)` — query",
    "`store_byor_key_in_db(...)` — mutates",
    "`check_byor_permitted(...)` — query",
    "`create_api_key(...)` — mutates (`org_id` omitted, explicit null and set are three cases)",
    "`list_api_keys(...)` — query",
    "`delete_api_key(...)` — mutates",
    "`get_current_api_key(...)` — query",
    "`refresh_managed_llm_api_key(...)` — mutates",
    "`get_llm_api_key_for_byor(...)` — query",
    "`refresh_llm_api_key_for_byor(...)` — mutates",
    "`validate_service_api_key(...)` — query (static shared secret, 503 when unconfigured)",
    "`get_or_create_api_key_for_user(...)` — mutates (service-to-service)",
    "`delete_user_api_key(...)` — mutates (service-to-service)",
    "`ApiKeyStore.create_api_key(...)` — mutates (raises when the user is missing)",
    "`ApiKeyStore.get_or_create_system_api_key(...)` — mutates",
    "`ApiKeyStore.validate_api_key(key)` — query",
    "`ApiKeyStore.delete_api_key(...)` / `delete_api_key_by_id(...)` / `delete_api_key_by_name(...)` — mutates",
    "`ApiKeyStore.list_api_keys(...)` — query (raises when the user is missing)",
    "`ApiKeyStore.is_system_key_name(name)` — query",
    "`ApiKeyStore.make_system_key_name(...)` — query",
]
headlineProperties = [
    "A deleted API key never validates again",
    "A key bound to an org only authorizes actions in that org",
    "A user-supplied name never collides with the reserved system namespace",
]
adversarySurface = [
    "`validate_service_api_key` comparing with `!=` rather than `hmac.compare_digest`",
    "no enforcement that a user-supplied key name cannot collide with the system namespace",
    "explicit null versus omitted `org_id` meaning different things",
    "a rotation where the LiteLLM delete succeeds and the DB write fails",
]
specHints = "Model the key as living in TWO stores that can disagree — the local row (`storage/api_key_store.py:85`) and LiteLLM — since every rotation writes both without a transaction (`server/routes/api_keys.py:443`, `:600`). The `org_id` tri-state on `create_api_key` (`:241`) is a real domain, and `validate_service_api_key`'s `!=` compare (`server/routes/service.py:88`) is the weak check to model over a prefix-matching wrong secret."
cardRead = false
connectionsRead = false
spec = ""
version = 0
observationsConfirmed = false
propertiesConfirmed = false
confirmedObservations = []
confirmedProperties = []
retiredObservations = []
retiredProperties = []
