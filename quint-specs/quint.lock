[system]
systemId = "OpenHands Enterprise"

[[system.composition]]
name = "Org membership and access"
shape = "clique"

[[system.composition.roleGroups]]
role = "peer"
componentKey = "org-lifecycle"
cardinality = 1

[[system.composition.roleGroups]]
role = "peer"
componentKey = "org-membership-roles"
cardinality = 1

[[system.composition.roleGroups]]
role = "peer"
componentKey = "org-invitations"
cardinality = "many"

[[system.composition.roleGroups]]
role = "peer"
componentKey = "default-org-bootstrap"
cardinality = 1

[[system.composition.roleGroups]]
role = "peer"
componentKey = "rbac-authorization"
cardinality = 1

[[system.composition.roleGroups]]
role = "peer"
componentKey = "org-git-claims"
cardinality = "many"

[[system.composition.roleGroups]]
role = "peer"
componentKey = "org-api-surface"
cardinality = 1

[[system.composition.groupProperties]]
name = "Never ownerless"
statement = "No sequence of invitations, removals, demotions, org deletions or bootstrap runs can leave an org with zero owners or the instance with zero super admins."

[[system.composition.groupProperties]]
name = "No orphaned user"
statement = "Deleting an org never leaves a member with no org at all without their own action."

[[system.composition.groupProperties]]
name = "One claim per git org"
statement = "A git organization is claimed by at most one OpenHands org, so a webhook for it can only ever route to one place."

[[system.composition.bridgeChecks]]
assumer = "rbac-authorization"
provider = "org-membership-roles"
requirement = "the role a permission check reads is the member's current role, so a demotion takes effect on the next request rather than after a cache expiry"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "org-invitations"
provider = "org-membership-roles"
requirement = "accepting an invitation adds membership exactly once, and a concurrent accept through the login path does not produce a second membership or a lost status flip"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "default-org-bootstrap"
provider = "org-lifecycle"
requirement = "the single-default-org flag is genuinely exclusive under concurrent first-logins, and the loser of that race does not leave an orphaned org behind"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "org-api-surface"
provider = "rbac-authorization"
requirement = "every org route carries a permission dependency, so no endpoint reaches a service with the membership check skipped"
status = "unchecked"

[[system.composition]]
name = "Request admission"
shape = "star"

[[system.composition.roleGroups]]
role = "center"
componentKey = "saas-user-auth"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "rbac-authorization"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "api-keys"
cardinality = "many"
note = "a user may hold many keys, each bound to at most one org"

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "rate-limiting"
cardinality = 1
correctnessAssumption = "none required"

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "jwt-crypto-service"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "token-manager"
cardinality = 1

[[system.composition.groupProperties]]
name = "Single identity"
statement = "Every request that reaches a route handler has resolved to exactly one caller identity and exactly one effective org, decided once and cached for the request."

[[system.composition.groupProperties]]
name = "No cross-org reach"
statement = "A caller can never act on an org they are not a member of, whether they name it by path, header, or query string."

[[system.composition.groupProperties]]
name = "Key scope respected"
statement = "An API key bound to one org can never be used to act on another org, even when the caller is a member of both."

[[system.composition.bridgeChecks]]
assumer = "rbac-authorization"
provider = "saas-user-auth"
requirement = "the effective org handed to a permission check is the one the caller is actually authorised for, with any client-supplied org_id already discarded"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "api-keys"
provider = "saas-user-auth"
requirement = "a mismatch between the key's bound org and the request's target org is rejected before the key is treated as valid"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "saas-user-auth"
provider = "jwt-crypto-service"
requirement = "a session cookie only verifies when signed by a key the service still recognises, and a token with no key id is not accepted as if it were current"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "saas-user-auth"
provider = "token-manager"
requirement = "an access token handed back is unexpired, or the refresh already happened, so no handler ever presents a stale provider credential"
status = "unchecked"

[[system.composition]]
name = "Signup admission"
shape = "star"

[[system.composition.roleGroups]]
role = "center"
componentKey = "signup-verification-gate"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "token-manager"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "rate-limiting"
cardinality = 1
correctnessAssumption = "none required"

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "default-org-bootstrap"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "org-invitations"
cardinality = "many"

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "user-provisioning"
cardinality = 1

[[system.composition.groupProperties]]
name = "One account per person"
statement = "A single human cannot end up with two accounts by varying their email with a plus-modifier or by racing two signups."

[[system.composition.groupProperties]]
name = "No half-created identity"
statement = "A rejected or failed signup never leaves a usable Keycloak identity behind without a matching application user, in either direction."

[[system.composition.groupProperties]]
name = "Landing org is deliberate"
statement = "A new user lands in an org only through an invitation they were sent, an explicit provisioning call, or the configured default-org rule — never by accident."

[[system.composition.bridgeChecks]]
assumer = "signup-verification-gate"
provider = "token-manager"
requirement = "the duplicate base-email lookup reflects every existing identity, and its failing open on an outage does not silently admit a duplicate account"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "default-org-bootstrap"
provider = "org-invitations"
requirement = "a user who arrives holding a pending invitation is placed in the invited org rather than being auto-joined to the default org first"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "user-provisioning"
provider = "token-manager"
requirement = "a create that collides with an existing Keycloak user is recoverable by re-query, so the idempotent path never destroys the identity it just found"
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "signup-verification-gate"
provider = "rate-limiting"
requirement = "verification resend and email-change endpoints stay throttled per user rather than only per IP, which an unauthenticated caller can rotate"
status = "unchecked"

[[system.composition]]
name = "Device authorization"
shape = "two-party"

[[system.composition.roleGroups]]
role = "center"
componentKey = "device-oauth-flow"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "api-keys"
cardinality = 1

[[system.composition.groupProperties]]
name = "One code, one key"
statement = "A device code yields at most one API key, and a denied or expired code yields none."

[[system.composition.groupProperties]]
name = "No authorized-but-keyless code"
statement = "A code never remains authorized when the key it was supposed to mint failed to be created."

[[system.composition.bridgeChecks]]
assumer = "device-oauth-flow"
provider = "api-keys"
requirement = "a key minted for a device is scoped to the org the approving user actually chose, and a minting failure is compensated by denying the code"
status = "unchecked"

[[system.composition]]
name = "Service key provisioning"
shape = "two-party"

[[system.composition.roleGroups]]
role = "center"
componentKey = "service-and-readiness-routes"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "api-keys"
cardinality = "many"

[[system.composition.groupProperties]]
name = "Membership gates minting"
statement = "A service-minted key is only ever issued for a user who is currently a member of the org the key will be scoped to."

[[system.composition.bridgeChecks]]
assumer = "service-and-readiness-routes"
provider = "api-keys"
requirement = "a key minted on behalf of the automations service is bound to the named org rather than falling back to the user's current org"
status = "unchecked"

