]
dependencies = [
    "saas-user-auth",
    "rbac-authorization",
]
operations = [
    "create_api_key(user_id, name, expires_at, not_before, org_id, use_current_org_fallback) — mutates",
    "get_or_create_system_api_key(user_id, org_id, name) — mutates",
    "validate_api_key(api_key) — mutates",
    "delete_api_key(user_id, name) — mutates",
    "delete_api_key_by_id(key_id) — mutates",
    "delete_api_key_by_name(user_id, name, allow_system) — mutates",
    "list_api_keys(user_id, org_id) — query",
    "retrieve_mcp_api_key(user_id) — query",
    "retrieve_api_key_by_name(user_id, name) — query",
]
headlineProperties = [
    "A key is valid iff not_before <= now < expires_at, with both bounds independent and optional; an out-of-window key never advances last_used_at.",
    "last_used_at is written at most once per 5-second debounce window per key, via a WHERE-guarded UPDATE that no-ops when another writer already advanced it.",
    "System keys are excluded from listings and cannot be deleted without allow_system.",
]
adversarySurface = [
    "Creating a key with org_id omitted silently binds it to current_org_id unless the caller opts out, so a key can end up scoped to an org the caller did not name.",
    "Concurrent validations race the last_used_at CAS by design, degrading to a no-op update rather than a lock wait.",
]
