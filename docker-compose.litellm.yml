# Opt in with: docker compose -f docker-compose.yml -f docker-compose.litellm.yml up --wait
# See docs/compose-litellm.md before enabling on an existing installation.
x-managed-llm: &managed-llm
  ENABLE_LEGACY_LITELLM: 'true'
  LITE_LLM_API_URL: http://litellm:4000
  LITE_LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-compose-master-key}
  LITELLM_DEFAULT_MODEL: litellm_proxy/claude-haiku-4-5-20251001

services:
  app:
    environment: *managed-llm
    depends_on:
      litellm:
        condition: service_healthy

  worker:
    environment: *managed-llm
    depends_on:
      litellm:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:1.94.1
    command: ['--config', '/app/config.yaml', '--port', '4000', '--num_workers', '1']
    environment:
      DATABASE_URL: postgresql://${DB_USER:-openhands}:${DB_PASS:-openhands}@db:5432/${LITELLM_DB_NAME:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-compose-master-key}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-local-compose-salt-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      STORE_MODEL_IN_DB: 'False'
      LITELLM_LOG: ERROR
    volumes:
      - ./dev_config/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
