# This is intentionally tiny — all real logic lives in
# landing-checklist-reusable.yml, called here via a same-repo relative path.
#
# Scoped to OpenHands/enterprise only for now (the pilot repo): we're moving
# away from using OpenHands/OpenHands as the shared home for this kind of
# cross-repo eng-process artifact, so there is currently no cross-repo
# `owner/repo@ref` reference to maintain. If a second production repo
# onboards later, see the note at the top of landing-checklist-reusable.yml
# for the two ways it could consume this workflow.
name: Landing Checklist

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

jobs:
  landing-checklist:
    uses: ./.github/workflows/landing-checklist-reusable.yml
    permissions:
      pull-requests: write
      contents: read
