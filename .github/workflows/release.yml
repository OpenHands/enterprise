name: release

# Single release line for the whole repo (semver X.Y.Z tags, covers enterprise/).
#
# BOOTSTRAP: the config sets a top-level `last-release-sha` to bound the first
# release's notes (the existing tags aren't reachable from main). Delete that
# line once the first release PR has merged — it caps every run, not just the
# first.
on:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    uses: OpenHands/release-actions/.github/workflows/release-please.yml@main
