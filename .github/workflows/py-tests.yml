# Workflow that runs python tests
name: Run Python Tests

# The jobs in this workflow are required, so they must run at all times
# * Always run on "main"
# * Always run on PRs
on:
  push:
    branches:
      - main
  pull_request:

# If triggered by a PR, it will be in the same group. However, each commit on main will be in its own unique group
concurrency:
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Run one shard of the python unit tests on Linux.
  # pytest-split divides tests/unit into `splits` groups of similar duration,
  # using the durations committed in .test_durations. Tests missing from that
  # file get the average duration. Refresh the file by hand when shards get
  # out of balance. The committed file comes from CI timings: add
  # `--store-durations --durations-path .test_durations.<group>` to the
  # pytest command, upload those files, and merge them into one JSON object.
  test-shard:
    name: Python Tests on Linux (${{ matrix.python-version }}, shard ${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        # Keep this list equal to 1..--splits below.
        group: [1, 2, 3, 4]
    permissions:
      # For coverage comment and python-coverage-comment-action branch
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # The translation test runs a node script from frontend/scripts.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      # The three cross-repo gateway modules below need a real checkout of
      # OpenHands/automation (AUTOMATION_SOURCE_DIR) plus openhands-workspace
      # installed to a private, non-site-packages directory (PYTHONPATH) --
      # pinned to a commit SHA and a version respectively so the gateway
      # tests exercise a known-good snapshot, not whatever `main` is today.
      # Fetched/installed on shard 1 only, and run there as their own pytest
      # process (next step) with that env scoped to its own `run:` block, so
      # the default `./tests/unit` run on every shard -- including shard 1's
      # own run below -- never sees AUTOMATION_SOURCE_DIR or PYTHONPATH and
      # those three modules collect as a clean, documented module-level skip
      # (see _backend_adapter.py) there instead.
      - name: Check out pinned automation source for gateway tests
        if: matrix.group == 1
        uses: actions/checkout@v7
        with:
          repository: OpenHands/automation
          ref: 1b571fd2b93c4c6ea4a58eb237fc718a8f158e4e
          path: .ci-automation
          persist-credentials: false
      - name: Install workspace dependency for gateway automation tests
        if: matrix.group == 1
        run: uv pip install --python .venv/bin/python --target "$RUNNER_TEMP/gateway-test-deps" --no-deps openhands-workspace==1.62.0
      - name: Run Unit Tests
        # Coverage sources (openhands/ plus the SaaS modules) come from
        # [tool.coverage.run] in pyproject.toml. The coverage gate runs on the
        # combined data in the test-on-linux job, not per shard.
        # --dist worksteal rebalances tests across workers as they finish,
        # rather than handing out fixed batches up front; this matters here
        # because DB-backed tests run noticeably slower than the rest of the
        # suite. `-s` is dropped so output stays captured per-test instead of
        # every worker writing straight through, uncaptured, under -n auto.
        run: >-
          uv run pytest -n auto --dist worksteal ./tests/unit --cov --cov-branch
          --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration
        env:
          COVERAGE_FILE: ".coverage.${{ matrix.python-version }}.${{ matrix.group }}"
      - name: Run cross-repo gateway automation tests
        if: matrix.group == 1
        # Separate process so AUTOMATION_SOURCE_DIR/PYTHONPATH apply only to
        # these three modules' collection and import resolution, never to the
        # ~1/4 of ./tests/unit that shard 1 just ran above. --cov-append adds
        # to the same shard-1 coverage file rather than starting a new one.
        run: >-
          uv run pytest
          tests/unit/server/customer_gateway/test_automation_backend_real_launch.py
          tests/unit/server/customer_gateway/test_automation_run_lifecycle.py
          tests/unit/server/customer_gateway/test_automation_dispatcher_caller_linkage.py
          --cov --cov-append --cov-branch
        env:
          COVERAGE_FILE: ".coverage.${{ matrix.python-version }}.${{ matrix.group }}"
          AUTOMATION_SOURCE_DIR: ${{ github.workspace }}/.ci-automation
          PYTHONPATH: ${{ runner.temp }}/gateway-test-deps
      - name: Store coverage file
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.group }}
          path: ".coverage.${{ matrix.python-version }}.${{ matrix.group }}"
          include-hidden-files: true

  # Gate job: passes only when every shard passes and the combined coverage
  # meets the minimum. Branch protection on main requires the check
  # "Python Tests on Linux (3.12)", so keep this name.
  test-on-linux:
    name: Python Tests on Linux (3.12)
    if: always()
    needs: [test-shard]
    runs-on: ubuntu-24.04
    steps:
      - name: Check shard results
        if: needs.test-shard.result != 'success'
        run: |
          echo "Test shards result: ${{ needs.test-shard.result }}"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-python-*
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      - name: Combine coverage and check the minimum
        run: |
          # Use the coverage version from uv.lock.
          COVERAGE_VERSION=$(grep -A1 '^name = "coverage"$' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          uvx --python 3.12 "coverage==${COVERAGE_VERSION}" combine
          uvx --python 3.12 "coverage==${COVERAGE_VERSION}" report --fail-under=72

  coverage-comment:
    name: Coverage Comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test-on-linux]

    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        id: download
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@93b152fbab4e3d4ebe90097d916e1c9d5f48d21d # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true
