name: Check Package Versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-package-versions:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for unreleased (git/URL) dependency pins in pyproject.toml
        run: |
          python - <<'PY'
          import sys, tomllib, pathlib

          path = pathlib.Path("pyproject.toml")
          if not path.exists():
              print("❌ ERROR: pyproject.toml not found")
              sys.exit(1)

          try:
              data = tomllib.loads(path.read_text(encoding="utf-8"))
          except Exception as e:
              print(f"❌ ERROR: Failed to parse pyproject.toml: {e}")
              sys.exit(1)

          sections = {"project.dependencies": data.get("project", {}).get("dependencies", [])}
          for group, deps in data.get("dependency-groups", {}).items():
              sections[f"dependency-groups.{group}"] = deps

          errors = []

          print("🔍 Checking for dependencies pinned to a git ref or URL...\n")
          for section_name, deps in sections.items():
              for dep in deps:
                  if not isinstance(dep, str):
                      continue
                  # A PEP 508 direct reference ("name @ git+https://...@<rev>") is the
                  # only way to pin an unreleased commit in a requirement string.
                  if "@" in dep.split(";")[0] or "://" in dep:
                      msg = f"  ✖ {dep!r} in [{section_name}] is a direct reference (NOT ALLOWED)"
                      print(msg)
                      errors.append(msg)
                  else:
                      print(f"  • {dep}: OK")

          # uv can also redirect a released name to a git ref via [tool.uv.sources].
          for pkg, src in data.get("tool", {}).get("uv", {}).get("sources", {}).items():
              for entry in (src if isinstance(src, list) else [src]):
                  if isinstance(entry, dict) and ("git" in entry or "url" in entry):
                      msg = f"  ✖ {pkg} in [tool.uv.sources] points at {entry} (NOT ALLOWED)"
                      print(msg)
                      errors.append(msg)

          if errors:
              print("\n❌ FAILED: Found dependencies pinned to a git ref or URL:\n" + "\n".join(errors))
              print("\nPlease use versioned releases instead, e.g.:")
              print('  "my-package==1.0.0"')
              sys.exit(1)

          print("\n✅ SUCCESS: No git/URL pins found. All dependencies are using proper versioned releases.")
          PY
