name: Check Package Versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-package-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for unreleased (git) dependency pins in pyproject.toml
        run: |
          python - <<'PY'
          import re, sys, tomllib, pathlib

          path = pathlib.Path("pyproject.toml")
          if not path.exists():
              print("❌ ERROR: pyproject.toml not found")
              sys.exit(1)

          try:
              data = tomllib.loads(path.read_text(encoding="utf-8"))
          except Exception as e:
              print(f"❌ ERROR: Failed to parse pyproject.toml: {e}")
              sys.exit(1)

          errors = []
          direct_ref = re.compile(r"@\s*(git\+|https?://|file:)")

          print("🔍 Checking for dependencies pinned to git refs or URLs...\n")

          # PEP 508 requirement strings: [project].dependencies and [dependency-groups].*
          requirement_lists = {"project.dependencies": data.get("project", {}).get("dependencies", [])}
          for group, reqs in data.get("dependency-groups", {}).items():
              requirement_lists[f"dependency-groups.{group}"] = [r for r in reqs if isinstance(r, str)]
          for section, reqs in requirement_lists.items():
              for req in reqs:
                  if direct_ref.search(req):
                      msg = f"  ✖ {req!r} in [{section}] is a direct git/URL reference (NOT ALLOWED)"
                      print(msg)
                      errors.append(msg)
                  else:
                      print(f"  • {req}: OK")

          # [tool.uv.sources]: git/url overrides (e.g. rev/branch pins to the SDK repo)
          sources = data.get("tool", {}).get("uv", {}).get("sources", {})
          for pkg, cfg in sources.items():
              cfgs = cfg if isinstance(cfg, list) else [cfg]
              for c in cfgs:
                  if isinstance(c, dict) and ({"git", "url", "rev", "branch", "tag"} & set(c)):
                      msg = f"  ✖ {pkg} in [tool.uv.sources] uses {c} (NOT ALLOWED)"
                      print(msg)
                      errors.append(msg)
                  else:
                      print(f"  • {pkg} in [tool.uv.sources]: OK")

          if errors:
              print("\n❌ FAILED: Found dependencies pinned to unreleased sources:\n" + "\n".join(errors))
              print("\nPlease use versioned releases instead, e.g.:")
              print('  "my-package==1.0.0"')
              sys.exit(1)

          print("\n✅ SUCCESS: No git/URL pins found. All dependencies are using proper versioned releases.")
          PY
