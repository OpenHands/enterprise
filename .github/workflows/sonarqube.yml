name: SonarQube

# main only. SonarQube Community Build has no branch or PR analysis: every submission
# lands on the project's single branch, so scanning a PR would overwrite the
# main-branch report card with proposed code. PR analysis needs the community branch
# plugin, which is a separate POC.
#
# pull_request_target must never be added here -- unlike pull_request, it exposes
# secrets to fork-triggered runs.
on:
  push:
    branches: [main]
  # Community Build has one branch per project, so a PR scan becomes the report card
  # until the next push to main. That is wanted here: it shows the repo's grade without
  # merging first. pull_request_target must never be used -- unlike pull_request, it
  # exposes secrets to fork-triggered runs.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    # Fork PRs get no secrets, so the scan could only fail on a missing token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube reads git history to attribute issues to authors.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Not a build. SonarJS resolves types from node_modules, and without them it
      # degrades to a shallower analysis silently rather than failing.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: openhands-ui/.bun-version

      - name: Install openhands-ui dependencies
        working-directory: openhands-ui
        run: bun install --frozen-lockfile

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
