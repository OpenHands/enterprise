name: pr

# Lints PR titles (conventional commits) and applies a `type:` label.
# Runs on pull_request_target to cover forks — keep it fork-safe: no checkout of
# PR code and no `secrets: inherit` here (see release-actions/pr-title.yml).
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

# Concurrent title updates can race while removing a stale type label.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-title:
    permissions:
      pull-requests: write
    uses: OpenHands/release-actions/.github/workflows/pr-title.yml@main
