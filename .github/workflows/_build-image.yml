# Reusable workflow: build a multi-arch Docker image and publish a merged manifest.
# Called from .github/workflows/ghcr-build.yml.
name: Build and push multi-arch image

on:
  workflow_call:
    inputs:
      image:
        description: Fully-qualified image name (e.g. "ghcr.io/openhands/enterprise-server").
        required: true
        type: string
      context:
        description: Docker build context.
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile.
        required: true
        type: string
      target:
        description: Dockerfile stage to build. Empty builds the last stage.
        required: false
        type: string
        default: ""
      extra-build-args:
        description: Additional build-args (newline-separated). OPENHANDS_BUILD_VERSION is added automatically.
        required: false
        type: string
        default: ""
      provenance:
        description: Value passed to docker/build-push-action provenance.
        required: false
        type: boolean
        default: false
      sbom:
        description: Value passed to docker/build-push-action sbom.
        required: false
        type: boolean
        default: false
      buildx-driver-opts:
        description: Extra buildx driver-opts (e.g. "network=host" for enterprise).
        required: false
        type: string
        default: ""
      push:
        description: Whether to push the built image to the registry. Set to false to build-only (e.g. on fork PRs whose read-only GITHUB_TOKEN cannot write org packages), so required build checks still report success.
        required: false
        type: boolean
        default: true

env:
  RELEVANT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RELEVANT_REF_NAME: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

jobs:
  build:
    name: Build ${{ inputs.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          driver-opts: ${{ inputs.buildx-driver-opts }}
      - name: Compute per-arch tags
        id: meta
        uses: ./.github/actions/docker-image-tags
        with:
          image: ${{ inputs.image }}
          ref-name: ${{ env.RELEVANT_REF_NAME }}
          suffix: -${{ matrix.arch }}
      - name: Compute registry cache config
        # Registry cache (type=registry) reads and writes to the org's ghcr.io
        # package, which a fork PR's read-only GITHUB_TOKEN cannot access. Only
        # configure it when we are pushing (non-fork). Build-only runs skip the
        # cache entirely — slower, but the build still compiles and the required
        # per-arch checks report success.
        id: cache
        if: ${{ inputs.push }}
        shell: bash
        run: |
          {
            printf 'cache-from<<%s\n' 'EOF'
            printf 'type=registry,ref=%s:buildcache-%s\n' "${{ inputs.image }}" "${{ steps.meta.outputs.version }}"
            printf 'type=registry,ref=%s:buildcache-main-%s\n' "${{ inputs.image }}" "${{ matrix.arch }}"
            printf '%s\n' 'EOF'
            printf 'cache-to=%s\n' "type=registry,ref=${{ inputs.image }}:buildcache-${{ steps.meta.outputs.version }},mode=max"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            OPENHANDS_BUILD_VERSION=${{ env.RELEVANT_REF_NAME }}
            ${{ inputs.extra-build-args }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}

  merge:
    name: Merge manifest
    runs-on: ubuntu-22.04
    needs: build
    # Merging requires the arch images to exist in the registry, which only
    # happens when push is enabled. Skip on build-only runs (e.g. fork PRs).
    if: ${{ inputs.push }}
    permissions:
      # This job checks out the repo for the merge action, so it needs contents
      # read as well — declaring only `packages` denies it, and checkout of a
      # private repo then fails with "Repository not found".
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Compute base tags
        id: meta_base
        uses: ./.github/actions/docker-image-tags
        with:
          image: ${{ inputs.image }}
          ref-name: ${{ env.RELEVANT_REF_NAME }}
      - name: Merge manifests
        uses: ./.github/actions/docker-merge-manifest
        with:
          base-tags: ${{ steps.meta_base.outputs.tags }}
          archs: "amd64 arm64"
