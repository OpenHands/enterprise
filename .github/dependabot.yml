version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: cron
      cronjob: 0 * * * *
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # put packages in their own group if they have a history of breaking the build or needing to be reverted
      pre-commit:
        patterns:
          - "pre-commit"
      browsergym:
        patterns:
          - "browsergym*"
      mcp-packages:
        patterns:
          - "mcp"
      security-all:
        applies-to: "security-updates"
        patterns:
          - "*"
      version-all:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: cron
      cronjob: 0 * * * *
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - "*eslint*"
      security-all:
        applies-to: "security-updates"
        patterns:
          - "*"
      version-all:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/docker-image-tags"
      - "/.github/actions/docker-merge-manifest"
    schedule:
      interval: cron
      cronjob: 0 * * * *
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "containers/*"
    schedule:
      interval: cron
      cronjob: 0 * * * *
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
